<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#F0E46C"/>
      <stop offset="0.38" stop-color="#D7A23C"/>
      <stop offset="0.72" stop-color="#9C7830"/>
      <stop offset="1"    stop-color="#784818"/>
    </linearGradient>
    <linearGradient id="green" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9BD44E"/>
      <stop offset="1" stop-color="#6FA832"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#070809"/>

  <!-- J : short top bar, heavy stem, bottom hook. Bar is kept narrow so the
       silhouette doesn't read as a T once it shrinks to 32px. -->
  <path d="M120 136 h124 v54 h-35 v118
           a82 82 0 0 1 -82 82
           a82 82 0 0 1 -68 -36 l44 -30
           a38 38 0 0 0 30 16 a37 37 0 0 0 37 -37 V190 h-50 z"
        fill="url(#gold)"/>

  <!-- C : open ring, green, opening to the right -->
  <path d="M410 190 a120 120 0 0 0 -86 -38 a120 120 0 0 0 0 240
           a120 120 0 0 0 86 -38 l-38 -35
           a71 71 0 0 1 -48 20 a71 71 0 0 1 0 -142
           a71 71 0 0 1 48 20 z"
        fill="url(#green)"/>
</svg>